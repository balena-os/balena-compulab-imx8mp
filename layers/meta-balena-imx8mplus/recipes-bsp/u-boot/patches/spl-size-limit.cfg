# The SPL area of the OCRAM, from CONFIG_SPL_TEXT_BASE 0x920000 to the stack top
# CONFIG_SPL_STACK 0x96dff0, without the DDR firmware (0x11000) and the FIT
# hash (0x20) appended after the SPL. do_check_spl_size_limit checks it.
CONFIG_SPL_SIZE_LIMIT=0x3cfd0
CONFIG_SPL_SIZE_LIMIT_SUBTRACT_GD=y
CONFIG_SPL_SIZE_LIMIT_SUBTRACT_MALLOC=y
# Stack budget, the measured peak is 3184 bytes
CONFIG_SPL_SIZE_LIMIT_PROVIDE_STACK=0x2000
