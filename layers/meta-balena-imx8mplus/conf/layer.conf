BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "balena-imx8mplus"
BBFILE_PATTERN_balena-imx8mplus := "^${LAYERDIR}/"
BBFILE_PRIORITY_balena-imx8mplus = "1337"
LAYERSERIES_COMPAT_balena-imx8mplus = "scarthgap"

BBMASK += "meta-bsp-imx8mp/recipes-nxp-demo-experience/nxp-demo-experience"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/base-files"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/coremark"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/systemd"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/wpa-supplicant"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/u-boot-ai-script"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/u-boot-scr"
BBMASK += "meta-compulab-bsp/meta-bsp/recipes-bsp/u-boot-update-scr"

# The boot image is built by the NXP imx-boot recipe, so that it can be HAB
# signed, instead of by U-Boot (binman). Mask Compulab's imx-boot placeholder,
# which would otherwise be preferred by its higher version.
BBMASK += "meta-bsp-imx8mp/recipes-bsp/compulab-bootloader/imx-boot_2.0.bb"
UBOOT_PROVIDES_BOOT_CONTAINER:forcevariable = "0"
PREFERRED_PROVIDER_imx-boot:forcevariable = "imx-boot"

# Masked because it disables the `tr` command in initramfs,
# causing the data partition to not be expanded.
BBMASK += "meta-bsp-imx8mp/recipes-core/busybox"
KERNEL_IMAGETYPE:compulab-mx8mp = "Image.gz"
KERNEL_PACKAGE_NAME="kernel"

KERNEL_DEVICETREE:iot-gate-imx8plus += " \
       compulab/iot-gate-imx8plus.dtb \
       compulab/iot-gate-imx8plus-usbdev.dtb \
       compulab/iot-gate-imx8plus-m2tpm.dtb \
       compulab/iot-gate-imx8plus-m7.dtb \
       compulab/iot-gate-imx8plus-mdpcb-m2tpm.dtb \
"

# Mask meta-balena-hab recipes for other SOM families
BBMASK += "meta-balena-hab/recipes-bsp/u-boot/u-boot-variscite.bbappend"
BBMASK += "meta-balena-hab/recipes-kernel/linux/linux-variscite_%.bbappend"

DRAM_CONF:iotdin-imx8p="d2d4"
DRAM_CONF:iotdin-imx8p-d1d8="d1d8"

DRAM_CONF:iot-gate-imx8plus="d2d4"
DRAM_CONF:iot-gate-imx8plus-d1d8="d1d8"

HOSTTOOLS:remove = " git-lfs "
HOSTTOOLS:remove = " bison "
MACHINE_FEATURES:remove = "optee-os"
MACHINE_FEATURES:remove = "optee"
MACHINE_FEATURES:remove = "efi"

# Auto-load imx_rpmsg_tty module at boot for M7 RPMsg communication
IMAGE_INSTALL:append:iot-gate-imx8plus = " imx-rpmsg-tty-autoload"

# remove unused bbappends because we either don't use them or they don't match anymore with the versions in the updated layers
BBMASK += "meta-imx/meta-imx-bsp/recipes-connectivity/openssl/openssl_3.2.%.bbappend"
BBMASK += "meta-imx/meta-imx-bsp/recipes-multimedia/pipewire/"
BBMASK += "meta-imx/meta-imx-bsp/recipes-multimedia/wireplumber/"

# The kernel bundle of the bootloader is the largest file of the boot partition
# and the initramfs it includes is larger on secure boot builds. The OS
# initramfs also includes the flasher and its secure boot tools for the migrate
# module, and has to fit IMAGE_ROOTFS_MAXSIZE. Build the recipes that make most
# of both initramfs, and that are not critical for the system, optimized for
# size. Only for the secure boot builds, the last -O flag wins. glibc, openssl
# and systemd are not included on purpose.
BALENA_SIZE_OPTIMIZATION = "${@oe.utils.conditional('SIGN_API', '', '', ' -Os', d)}"
FULL_OPTIMIZATION:append:pn-bash = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-coreutils = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-dosfstools = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-e2fsprogs = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-gmp = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-gnupg = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-gnutls = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-jq = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-kexec-tools = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libassuan = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libgcrypt = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libgpg-error = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libidn2 = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libksba = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libtasn1 = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-libunistring = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-lvm2 = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-mmc-utils = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-mtools = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-nettle = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-npth = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-onig = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-p11-kit = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-parted = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-pinentry = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-shadow = "${BALENA_SIZE_OPTIMIZATION}"
FULL_OPTIMIZATION:append:pn-util-linux = "${BALENA_SIZE_OPTIMIZATION}"
